[package]
name = "brushes-converter"
version = "0.1.0"
authors = ["danie <danielrpereira.98@gmail.com>"]
edition = "2021"
publish = false

[dependencies]
eframe = "0.27.2"
rfd = "0.14.0"

clap = {version = "4.5.4", features = ["derive"] }

image = "0.25"
png = "0.17"
md5 = "0.7"
zip = "2.2"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
binrw = "0.14"
thiserror = "1.0"
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.13"
